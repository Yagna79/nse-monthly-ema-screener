name: Daily 10-EMA Cloud Scan & Deploy

on:
  schedule:
    # Runs Monday to Friday at 10:30 UTC (4:00 PM IST Market Close)
    - cron: '30 10 * * 1-5'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 10-EMA Cloud Scanner & Intelligence Suite
        run: |
          python run_cloud_scan.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add screener_database.json intelligence_cache.json index.html
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Auto-update: Daily 10-EMA Screener & Financials [skip ci]"
            git push
          fi
